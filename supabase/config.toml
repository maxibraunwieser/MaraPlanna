# Minimal Supabase CLI config for MaraPlanna.
project_id = "maraplanna"

[functions.garmin]
# The function verifies the caller's Supabase session itself (and accepts a
# cron secret for scheduled syncs), so the gateway JWT check is disabled.
verify_jwt = false

[functions.calendar]
# Calendar apps can't log in: the secret token in the URL authorises the feed.
verify_jwt = false

[functions.watch]
# Watches authenticate with their own secret; the website calls are checked in the function.
verify_jwt = false
